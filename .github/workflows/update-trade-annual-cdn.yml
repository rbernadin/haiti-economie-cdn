name: Update Haiti Annual Trade CDN

on:
  workflow_dispatch:

  schedule:
    # Check daily for a new annual observation or historical revision
    - cron: "20 12 * * *"

permissions:
  contents: write

concurrency:
  group: update-trade-annual-cdn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Build annual trade CDN
        env:
          TRADE_ANNUAL_API_URL: https://haiti-economie-api.onrender.com/api/trade-history-standardized?count=all
          TRADE_ANNUAL_OUT_DIR: cdn/annual/trade-haiti
        run: |
          node scripts/build-trade-annual-cdn.mjs

      - name: Stage generated files
        run: |
          git add cdn/annual/trade-haiti

      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No annual trade changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Annual trade data changed."
            git status --short
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Haiti annual trade data"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push