name: Update Approved Budget CDN

on:
  workflow_dispatch:

  schedule:
    - cron: "25 11 * * *"

permissions:
  contents: write

concurrency:
  group: update-approved-budget-cdn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build approved budget CDN
        env:
          BUDGET_APPROVED_API_URL: https://haiti-economie-api.onrender.com/api/budget-approved-standardized?count=all
        run: node scripts/build-budget-approved-cdn.mjs

      - name: Commit CDN changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cdn/daily/budget-approved

          if git diff --cached --quiet; then
            echo "No budget CDN changes detected."
            exit 0
          fi

          git commit -m "Update approved budget CDN"
          git push