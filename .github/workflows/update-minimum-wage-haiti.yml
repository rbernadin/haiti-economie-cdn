name: Update Haiti Minimum Wage CDN

on:
  schedule:
    - cron: "15 10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update Haiti minimum wage data
        run: node scripts/update-minimum-wage-haiti.mjs

      - name: Validate JSON
        run: jq empty cdn/daily/minimum-wage-haiti.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cdn/daily/minimum-wage-haiti.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Haiti minimum wage data"
          git push