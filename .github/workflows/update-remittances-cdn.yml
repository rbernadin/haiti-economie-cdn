name: Update Haiti Remittances CDN

on:
  workflow_dispatch:

  schedule:
    # Check daily for a new month or BRH revision
    - cron: "35 11 * * *"

permissions:
  contents: write

concurrency:
  group: update-remittances-cdn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build remittances CDN
        env:
          REMITTANCES_API_URL: https://haiti-economie-api.onrender.com/api/remittances-standardized?count=all
          REMITTANCES_OUT_DIR: cdn/daily/remittances-haiti
        run: |
          node scripts/build-remittances-cdn.mjs

      - name: Stage generated files
        run: |
          git add cdn/daily/remittances-haiti

      - name: Check for changes
        id: changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No remittances changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Remittances data changed."
            git status --short
          fi

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Haiti monthly remittances data"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push